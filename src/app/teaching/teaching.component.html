<section class='style3 p-h-10'>
    <div class='medium-break'></div>
    <h2>Courses</h2>
    <hr class='line-break-light' />
    <div class="grid-item">
        <ng-container *ngFor="let entry of courses">
            <ng-container *ngTemplateOutlet="card; context: { $implicit: entry }"></ng-container>
        </ng-container>
    </div>
    <div class="medium-break"></div>
</section>

<section class='style3 alt p-h-10'>
    <div class="medium-break"></div>
    <h2>Teaching Assistant</h2>
    <hr class='line-break-light' />
    <div class="grid-item">
        <ng-container *ngFor="let entry of taPositions">
            <ng-container *ngTemplateOutlet="card; context: { $implicit: entry }"></ng-container>
        </ng-container>
    </div>
    <div class="medium-break"></div>
</section>

<section class='style3 p-h-10'>
    <div class="medium-break"></div>
    <h2>Mentorship</h2>
    <hr class='line-break-light' />
    <div class="grid-item">
        <ng-container *ngFor="let entry of mentorship">
            <ng-container *ngTemplateOutlet="card; context: { $implicit: entry }"></ng-container>
        </ng-container>
    </div>
    <div class="medium-break"></div>
</section>

<!-- Card shared by all three sections -->
<ng-template #card
             let-entry>
    <div class="description">
        <h3>{{entry.title}}</h3>
        <h4>{{entry.subtitle}}</h4>
        <hr class='line-break-light' />
        <p *ngFor="let paragraph of entry.description">
            {{paragraph}}
        </p>
        <div *ngIf="entry.links.length"
             class="flex-container horizontal link-row">
            <a *ngFor="let link of entry.links"
               class="link-button"
               target="_blank"
               rel="noopener noreferrer"
               href="{{link.url}}">{{link.name}}</a>
        </div>
    </div>
</ng-template>
